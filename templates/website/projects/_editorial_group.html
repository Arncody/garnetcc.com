<section class="ed-band{% if group_id == 'completed' %} ed-band-alt{% endif %}" id="{{ group_id }}" aria-labelledby="{{ group_id }}-title">
  <div class="container">
    <h2 class="ed-heading" id="{{ group_id }}-title">{{ group_title }}</h2>
    <div class="ed-project-grid">
      {% for project in projects %}
        {% include "website/projects/_editorial_card.html" with project=project %}
      {% empty %}
        <p class="ed-body">
          {% if group_id == 'completed' %}{{ T.no_completed }}
          {% else %}{{ T.no_ongoing }}{% endif %}
        </p>
      {% endfor %}
    </div>
  </div>
</section>
